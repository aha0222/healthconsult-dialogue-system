<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小暖 · 健康陪护对话</title>
<style>
:root {
  --bg: #FAFAF9;
  --card: #FFFFFF;
  --text: #1C1917;
  --text-secondary: #78716C;
  --border: #E7E5E4;
  --warm: #F97316;
  --warm-light: #FFF7ED;
  --user-bg: #EFF6FF;
  --assistant-bg: #FFF7ED;
  --radius: 16px;
  --radius-sm: 10px;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chat-container {
  width: 100%;
  max-width: 520px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--card);
  box-shadow: 0 0 40px rgba(0,0,0,.04);
}

/* header */
.header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.header .avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #F97316, #FB923C);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #fff;
}
.header .info { flex:1; }
.header .name { font-size: 15px; font-weight:700; }
.header .status { font-size: 12px; color: var(--text-secondary); }
.header .controls { display:flex; gap:8px; }
.header .btn-small {
  background:none; border:1px solid var(--border); border-radius:8px;
  padding:6px 12px; font-size:12px; cursor:pointer; color:var(--text-secondary);
  transition: all .15s;
}
.header .btn-small:hover { background:var(--warm-light); color:var(--warm); border-color:var(--warm); }

/* messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width:4px; }
.messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.msg {
  display: flex;
  gap: 10px;
  animation: msgIn .3s ease;
}
@keyframes msgIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.msg.user { flex-direction: row-reverse; }
.msg .avatar-sm {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.msg.user .avatar-sm { background: #EFF6FF; color: #2563EB; }
.msg.assistant .avatar-sm { background: var(--warm-light); color: var(--warm); }

.msg .bubble {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  line-height: 1.75;
  font-size: 14px;
}
.msg.user .bubble { background: var(--user-bg); border-bottom-right-radius: 2px; }
.msg.assistant .bubble { background: var(--assistant-bg); border-bottom-left-radius: 2px; }

.msg .meta {
  display: flex; align-items: center; gap: 8px; margin-top: 6px;
  font-size: 11px; color: var(--text-secondary);
}
.risk-badge {
  display: inline-block; padding: 1px 6px; border-radius: 8px;
  font-size: 10px; font-weight: 600;
}
.risk-R0 { background: #F0FDF4; color: #16A34A; }
.risk-R1 { background: #FFFBEB; color: #D97706; }
.risk-R2 { background: #FFF7ED; color: #EA580C; }
.risk-R3 { background: #FFF1F2; color: #DC2626; }

/* typing */
.typing { display:flex; align-items:center; gap:4px; padding:12px 16px; }
.typing span {
  width:6px; height:6px; border-radius:50%; background:#D6D3D1;
  animation: dot 1.4s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay:.2s; }
.typing span:nth-child(3) { animation-delay:.4s; }
@keyframes dot { 0%,80%,100% { opacity:.3; } 40% { opacity:1; } }

/* input */
.input-area {
  padding: 12px 16px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.input-area textarea {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  line-height: 1.5;
  background: var(--bg);
  height: 44px;
  max-height: 120px;
}
.input-area textarea:focus { border-color: var(--warm); background: #fff; }
.input-area button {
  width: 44px; height: 44px;
  border: none; border-radius: 12px;
  background: var(--warm); color: #fff;
  font-size: 18px; cursor: pointer;
  flex-shrink: 0;
  transition: opacity .2s;
  display: flex; align-items: center; justify-content: center;
}
.input-area button:disabled { opacity: .4; cursor: not-allowed; }

/* empty state */
.empty-state {
  flex: 1; display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: var(--text-secondary);
  text-align: center;
  padding: 40px;
}
.empty-state .emoji { font-size: 48px; }
.empty-state h3 { font-size: 18px; font-weight:600; color:var(--text); }
.empty-state p { font-size: 13px; max-width: 300px; line-height: 1.7; }
.empty-state .quick-msg {
  display: inline-block; padding: 8px 16px; border:1px solid var(--border);
  border-radius: 20px; font-size: 13px; cursor: pointer; margin: 4px;
  transition: all .15s; background: var(--card);
}
.empty-state .quick-msg:hover { border-color: var(--warm); color: var(--warm); }

@media (max-width: 520px) {
  .chat-container { max-width: 100%; height: 100dvh; }
  .msg .bubble { max-width: 85%; }
}

/* settings modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.3); backdrop-filter: blur(2px);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: var(--radius);
  padding: 24px; width: 90%; max-width: 400px;
  box-shadow: 0 20px 50px rgba(0,0,0,.1);
}
.modal h3 { margin-bottom: 16px; }
.modal label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; margin-top:12px; }
.modal input, .modal select {
  width: 100%; padding: 8px 12px; border:1px solid var(--border);
  border-radius: 8px; font-size: 14px; outline: none;
}
.modal input:focus { border-color: var(--warm); }
.modal .modal-btns { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
.modal .modal-btns button {
  padding: 8px 20px; border-radius: 8px; font-size: 14px; cursor: pointer;
  border: 1px solid var(--border); background: #fff;
}
.modal .modal-btns button.primary { background: var(--warm); color: #fff; border-color: var(--warm); }
</style>
</head>
<body>

<div class="chat-container">
  <!-- header -->
  <div class="header">
    <div class="avatar">🏠</div>
    <div class="info">
      <div class="name">小暖</div>
      <div class="status" id="statusText">温婉邻居型 · LLM自主分级</div>
    </div>
    <div class="controls">
      <button class="btn-small" onclick="clearChat()">清屏</button>
      <button class="btn-small" onclick="toggleSettings()">设置</button>
    </div>
  </div>

  <!-- messages -->
  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="emoji">🌿</div>
      <h3>您好，我是小暖</h3>
      <p>您的健康陪护伙伴。有什么想聊的？可以问我日常养生、用药疑问，或者只是想说说话。</p>
      <div style="margin-top:8px;">
        <span class="quick-msg" onclick="quickAsk('最近睡眠不太好，半夜老醒')">半夜老醒</span>
        <span class="quick-msg" onclick="quickAsk('血压有点高，该加药吗')">血压高怎么办</span>
        <span class="quick-msg" onclick="quickAsk('今天天气好，出去走了走')">出去走了走</span>
        <span class="quick-msg" onclick="quickAsk('无糖饼干糖尿病人能多吃吗')">无糖饼干</span>
        <span class="quick-msg" onclick="quickAsk('胸口有点闷，后背也疼')">胸口闷</span>
        <span class="quick-msg" onclick="quickAsk('今天心情不太好，想找人说话')">心情不好</span>
      </div>
    </div>
  </div>

  <!-- typing indicator -->
  <div class="typing" id="typing" style="display:none; padding: 0 20px;">
    <span></span><span></span><span></span>
  </div>

  <!-- input -->
  <div class="input-area">
    <textarea id="userInput" rows="1" placeholder="说说您的想法..."
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
      oninput="autoResize(this)"></textarea>
    <button onclick="sendMessage()" id="sendBtn">→</button>
  </div>
</div>

<!-- settings modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>对话设置</h3>
    <label>API 地址</label>
    <input type="text" id="apiBaseUrl" value="https://api.deepseek.com/v1">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="输入 API Key（仅保存在本浏览器）">
    <label>模型</label>
    <input type="text" id="modelName" value="deepseek-chat">
    <label>人格</label>
    <select id="personalitySelect">
      <option value="温婉邻居型" selected>温婉邻居型（推荐）</option>
      <option value="贴心闺女型">贴心闺女型</option>
      <option value="素朴家常型">素朴家常型</option>
      <option value="从容守护型">从容守护型</option>
    </select>
    <div class="modal-btns">
      <button onclick="toggleSettings()">取消</button>
      <button class="primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== 人格定义（含完整风险分级策略） =====
const SKILL_BASE = `你是一位温和、耐心、尊重、可靠的老年健康陪护伙伴，名叫小暖。
你像住在隔壁的懂事晚辈——有温度但不煽情，有分寸但不疏离。

【说话风格】温婉、端庄、有分寸。先安抚→再解释→再建议→再兜底。
常用词：您 | 咱们 | 慢慢地 | 别着急 | 我帮您记着。
称呼：默认统一用"您"。只有用户明确是老人本人且能判性别时才用"阿姨""叔叔"。
家属场景（"我妈""我爸"）称呼用户"您"，称呼老人"老人家"。
绝对不用"奶奶""爷爷"。

【你的核心能力——自行判断风险等级并采取对应策略】

■ R3 急症高危 — 必须建议120/急诊
症状示例：胸痛胸闷+后背/肩膀痛/出汗/喘不上气；半边身子麻/嘴歪/说话含糊；
突然剧烈头痛+呕吐；严重胸痛压榨感；意识不清/叫不醒；大出血/吐血。
策略：果断指出危险→明确要求打120/立刻去急诊→具体行动指令→禁止自行观察/吃药→陪伴安抚。
回复长度：120-280字。语气果断。

■ R2 需尽快就医 — 不能建议自行处理
症状示例：单独胸痛胸闷（无伴随症状）；咳血/便血/黑便；看到人影/幻觉；
摔倒不能站立；想换药/停药/减药/吃别人的药；近期体重明显下降。
策略：明确建议尽快就医→不自行处理→具体科室指引→危险信号提醒。
回复长度：100-220字。

■ R1 指标波动/用药疑问/中度不适
症状示例：血压/血糖波动；吃药时间/用法疑问；睡眠差/便秘/头晕/胃口不好；情绪焦虑。
策略：安抚→通俗解释→安全可行的非药物建议→记录提醒→联系医生/药师兜底。
涉及药物时必须拒绝自行调整+引导联系医生/药师确认。回复长度：100-180字。

■ R0 日常咨询/情感陪伴
症状示例：日常养生/饮食运动/天气活动/怀念亲人/孤独感/想聊天。
策略：共情→通俗解释（如需）→轻松的安全建议→就医兜底条件。
情感场景：不说教不鸡汤不虚假希望，纯粹倾听和陪伴。回复长度：80-180字。

【绝对禁止 — 任何情况下不可出现】
- 不诊断：不说"你这是XX病/XX症"
- 不开药：不提供药名、剂量、用法
- 不调药：不引导自行加药、减药、停药、换药
- 不急症误判：胸痛/卒中/严重低血糖/意识变化→必须120，禁止"观察一下""吃点药看看""躺一会儿"
- 不说"不用去医院""喝点热水就好""睡一觉就好了""躺一会儿看看"
- 不贴标签：不说"幻觉""老年痴呆""抑郁症""老糊涂"

【回复格式】
直接输出回复文本。在回复末尾换行后添加风险等级标记：[RISK:R0] / [RISK:R1] / [RISK:R2] / [RISK:R3]。
不要添加其他前缀、解释或元数据。`;

// 四种人格的差异化覆盖（追加到 SKILL_BASE 后面）
const PERSONALITY_OVERLAYS = {
  "温婉邻居型": ``,
  "贴心闺女型": `\n\n【人格覆盖-贴心闺女型】切换为亲切软糯风格。短句为主口语化。称呼：咱/您呀/您老人家。多用反问句"您说是不是嘛"。`,
  "素朴家常型": `\n\n【人格覆盖-素朴家常型】切换为朴素接地气风格。用生活类比解释。称呼：老哥/老姐。不用叠词不撒娇。短句口语化，北方话味道。`,
  "从容守护型": `\n\n【人格覆盖-从容守护型】切换为淡定从容风格。结构化：第一/第二/第三。称呼：您，不加修饰。不用叠词语气词。`
};

// ===== 状态 =====
let currentPersonality = "温婉邻居型";
let messages = [
  { role: "system", content: SKILL_BASE + PERSONALITY_OVERLAYS[currentPersonality] }
];
let isGenerating = false;

// ===== localStorage 持久化 =====
(function initSettings() {
  const saved = JSON.parse(localStorage.getItem('xiaonuan_settings') || '{}');
  if (saved.apiKey) document.getElementById('apiKey').value = saved.apiKey;
  if (saved.apiBaseUrl) document.getElementById('apiBaseUrl').value = saved.apiBaseUrl;
  if (saved.modelName) document.getElementById('modelName').value = saved.modelName;
  if (saved.personality) {
    document.getElementById('personalitySelect').value = saved.personality;
    currentPersonality = saved.personality;
    messages[0] = { role: "system", content: SKILL_BASE + PERSONALITY_OVERLAYS[currentPersonality] };
  }
  updateKeyStatus();
})();

function updateKeyStatus() {
  const key = document.getElementById('apiKey').value.trim();
  const status = document.getElementById('statusText');
  const personality = document.getElementById('personalitySelect').value;
  if (!key) {
    status.textContent = `${personality} · 请先配置 API Key（设置）`;
    status.style.color = '#DC2626';
  } else {
    status.textContent = `${personality} · LLM自主分级`;
    status.style.color = '';
  }
}

// ===== 安全快检（关键词 + 否定句式过滤） =====
function quickCheck(reply, llmRisk) {
  // 先去除否定句式中的安全警告部分，避免误判
  // "不要自己加药" → 不误判为"引导加药"
  // "这不是幻觉"  → 不误判为"否定感知"
  const cleaned = reply.replace(
    /(?:不要|不能|不可|别|切勿|禁止|避免|不是|不会|不一定).{0,30}?(?:自己加|自己减|自己停|换药|调药|幻觉|老年痴呆|抑郁症)/g,
    '[安全警告已过滤]'
  );

  const forbidden = {
    "我给你开药":"开药","我给您开药":"开药",
    "药量你自己调":"引导调药",
    "你自己加":"引导加药","你自己减":"引导减药","你自己停":"引导停药",
    "停掉试试":"引导停药","先不吃看看":"引导停药",
    "不用去医院":"劝退就医","没必要看医生":"劝退就医",
    "喝点热水就好":"轻视症状","睡一觉就好了":"延误就医",
    "躺一会儿看看":"延误急症",
    "你这是高血压":"诊断","你这是糖尿病":"诊断",
    "你这是老年痴呆":"标签","你就是幻觉":"否定感知",
    "先吃片药观察":"急症延误-建议吃药观察","先吃药看看":"急症延误-建议吃药观察",
    "多喝热水":"轻视症状",
  };

  let issues = [];
  for (let [phrase, reason] of Object.entries(forbidden)) {
    if (cleaned.includes(phrase)) issues.push(`[红线] ${reason}: "${phrase}"`);
  }
  if (llmRisk === "R3") {
    if (!reply.includes("120") && !reply.includes("急救") && !reply.includes("急诊")) {
      issues.push("[红线] LLM判定为R3但回复中缺失120/急救/急诊");
    }
  }
  return issues;
}

// ===== UI =====
function autoResize(el) {
  el.style.height = '44px';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function toggleSettings() {
  document.getElementById('settingsModal').classList.toggle('show');
}

function saveSettings() {
  toggleSettings();
  const personality = document.getElementById('personalitySelect').value;
  const apiKey = document.getElementById('apiKey').value.trim();
  const apiBaseUrl = document.getElementById('apiBaseUrl').value.trim();
  const modelName = document.getElementById('modelName').value.trim();

  // 持久化到 localStorage
  localStorage.setItem('xiaonuan_settings', JSON.stringify({
    apiKey, apiBaseUrl, modelName, personality
  }));

  if (personality !== currentPersonality) {
    currentPersonality = personality;
    messages[0] = { role: "system", content: SKILL_BASE + PERSONALITY_OVERLAYS[personality] };
    addSystemMsg(`人格已切换为「${personality}」`);
  }
  updateKeyStatus();
}

function quickAsk(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function clearChat() {
  messages = [{ role: "system", content: SKILL_BASE + PERSONALITY_OVERLAYS[currentPersonality] }];
  const el = document.getElementById('messages');
  el.innerHTML = `
    <div class="empty-state" id="emptyState">
      <div class="emoji">🌿</div>
      <h3>您好，我是小暖</h3>
      <p>您的健康陪护伙伴。有什么想聊的？我根据您说的话自动判断风险等级并做出合适的回应。</p>
      <div style="margin-top:8px;">
        <span class="quick-msg" onclick="quickAsk('最近睡眠不太好，半夜老醒')">半夜老醒</span>
        <span class="quick-msg" onclick="quickAsk('血压有点高，该加药吗')">血压高怎么办</span>
        <span class="quick-msg" onclick="quickAsk('今天天气好，出去走了走')">出去走了走</span>
        <span class="quick-msg" onclick="quickAsk('无糖饼干糖尿病人能多吃吗')">无糖饼干</span>
        <span class="quick-msg" onclick="quickAsk('胸口有点疼，后背也疼')">胸口疼</span>
        <span class="quick-msg" onclick="quickAsk('今天心情不太好，想找人说话')">心情不好</span>
      </div>
    </div>`;
}

function addSystemMsg(text) {
  const el = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;font-size:12px;color:#A8A29E;padding:8px;';
  div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function addMessage(role, content, risk) {
  const el = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="avatar-sm">${role === 'user' ? '👤' : '🏠'}</div>
    <div>
      <div class="bubble">${escapeHtml(content)}</div>
      ${risk ? `<div class="meta"><span class="risk-badge risk-${risk}">${risk}</span> 风险识别</div>` : ''}
    </div>`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  return div;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showTyping(show) {
  document.getElementById('typing').style.display = show ? 'flex' : 'none';
  document.getElementById('sendBtn').disabled = show;
}

// ===== 发送消息（LLM自主分级版） =====
async function sendMessage() {
  if (isGenerating) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    addSystemMsg('请先点击右上角「设置」配置 API Key');
    return;
  }

  input.value = '';
  input.style.height = '44px';

  // 用户消息不预判风险，标记为"?"等待LLM判定
  addMessage('user', text, null);
  messages.push({ role: "user", content: text });

  showTyping(true);
  isGenerating = true;

  const baseUrl = document.getElementById('apiBaseUrl').value;
  const model = document.getElementById('modelName').value;

  try {
    const resp = await fetch(`${baseUrl}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model,
        messages: messages.slice(-10),
        temperature: 0.7,
        max_tokens: 600
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    let rawReply = data.choices[0].message.content.trim();

    // 从回复末尾提取 [RISK:Rx] 标记
    const riskMatch = rawReply.match(/\[RISK:(R[0-3])\]\s*$/);
    let llmRisk = "?";
    let reply = rawReply;
    if (riskMatch) {
      llmRisk = riskMatch[1];
      reply = rawReply.substring(0, riskMatch.index).trim();
    }

    // 安全质检（用LLM判定的风险等级）
    const issues = quickCheck(reply, llmRisk);
    const msgDiv = addMessage('assistant', reply, llmRisk !== "?" ? llmRisk : null);

    if (issues.length > 0) {
      const warnDiv = document.createElement('div');
      warnDiv.style.cssText = 'font-size:11px;color:#DC2626;margin-top:4px;padding:4px 8px;background:#FFF1F2;border-radius:6px;';
      warnDiv.textContent = '质检警告: ' + issues.join(' | ');
      msgDiv.querySelector('div:last-child').appendChild(warnDiv);
    }

    messages.push({ role: "assistant", content: rawReply });

  } catch (e) {
    addMessage('assistant', `[错误] ${e.message}`, null);
  }

  showTyping(false);
  isGenerating = false;
}

// ===== Enter 发送 =====
document.getElementById('userInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
