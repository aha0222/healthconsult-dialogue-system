name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r tools/requirements.txt

      - name: Backend unit tests (safety checker + redline cases)
        run: python -m pytest backend/tests/test_safety_checker.py -v

      - name: Strict validation of skill dataset
        run: >-
          python tools/validate_outputs.py
          --input skills/healthconsult-assistant-skill/examples/v0.2.3_health_safety_repair.jsonl
          --mode generated_sft
