name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthconsult-assistant-skill
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Unit tests (safety checker + redline cases)
        run: python -m pytest tests/test_safety_checker.py -v

      - name: Strict validation of cleaned dataset
        run: python tests/validate_health_assistant_outputs.py --input examples/v0.2.3_health_safety_repair.jsonl --mode generated_sft
