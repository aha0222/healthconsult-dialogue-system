name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -r tools/requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check backend tools

      - name: Backend tests (safety checker + orchestrator + API + redline cases + persona evaluation)
        run: >-
          python -m pytest backend/tests -q
          --cov=backend.app --cov-report=term-missing --cov-fail-under=75

      - name: Risk classification baseline (stratified)
        run: >-
          python tools/eval_risk.py --mode local
          --min-accuracy 0.85
          --min-risk-accuracy R3:0.9,R2b:0.9
          --min-scene-f1 0.7

      - name: Strict validation of skill dataset
        run: >-
          python tools/validate_outputs.py
          --input skills/healthconsult-assistant-skill/examples/v0.2.3_health_safety_repair.jsonl
          --mode generated_sft
