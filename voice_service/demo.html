<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>voice_service 独立验证台</title>
<style>
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color:#1f2937; }
  h1 { font-size: 20px; }
  .row { margin: 14px 0; }
  button { font-size: 16px; padding: 10px 18px; border-radius: 8px; border: 1px solid #2563eb; background:#eff6ff; color:#1e3a8a; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  textarea { width: 100%; height: 90px; font-size: 15px; padding: 8px; box-sizing: border-box; }
  pre { background:#f3f4f6; padding: 12px; border-radius: 8px; white-space: pre-wrap; font-size: 13px; }
  .tag { font-size: 12px; color:#6b7280; }
</style>
</head>
<body>
  <h1>voice_service · 独立验证台</h1>
  <p class="tag">服务地址：<input id="base" value="http://127.0.0.1:8100" style="width:260px" /></p>

  <div class="row">
    <button id="btnHealth">1. 探活 /health</button>
  </div>

  <div class="row">
    <button id="btnRec">2. 录音并识别（/asr）</button>
    <span class="tag" id="recState"></span>
  </div>

  <div class="row">
    <textarea id="ttsText">您好，我是小暖，今天感觉怎么样？</textarea>
    <div><button id="btnTts">3. 合成播放（/tts）</button></div>
  </div>

  <pre id="log">（结果输出）</pre>

<script>
  const $ = (id) => document.getElementById(id);
  const log = (m) => { $("log").textContent += "\n" + m; };
  const base = () => $("base").value.replace(/\/$/, "");

  $("btnHealth").onclick = async () => {
    try {
      const r = await fetch(base() + "/health");
      log("[/health] " + r.status + " " + JSON.stringify(await r.json()));
    } catch (e) { log("[/health] 失败：" + e.message); }
  };

  let rec = null, chunks = [];
  $("btnRec").onclick = async () => {
    if (rec && rec.state === "recording") { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      rec = new MediaRecorder(stream);
      chunks = [];
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = async () => {
        $("recState").textContent = "上传中…";
        const blob = new Blob(chunks, { type: rec.mimeType });
        try {
          const r = await fetch(base() + "/asr?language=zh", {
            method: "POST",
            headers: { "Content-Type": blob.type || "application/octet-stream" },
            body: blob
          });
          log("[/asr] " + r.status + " " + (await r.text()));
        } catch (e) { log("[/asr] 失败：" + e.message); }
        $("recState").textContent = "";
        stream.getTracks().forEach(t => t.stop());
      };
      rec.start();
      $("recState").textContent = "录音中，再次点击停止…";
    } catch (e) { log("录音失败：" + e.message); }
  };

  $("btnTts").onclick = async () => {
    try {
      const r = await fetch(base() + "/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: $("ttsText").value, format: "wav", speed: 0.9 })
      });
      if (r.status !== 200) { log("[/tts] " + r.status + " " + (await r.text())); return; }
      const buf = await r.arrayBuffer();
      new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" }))).play();
      log("[/tts] 播放中…");
    } catch (e) { log("[/tts] 失败：" + e.message); }
  };
</script>
</body>
</html>
