<!DOCTYPE html>
<html lang="zh-CN" class="fs-normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E8722C">
<meta name="description" content="小暖 · 面向老年人的健康陪护对话助手">
<title>小暖 · 健康陪护</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/chat.css">
</head>
<body>

<a class="skip-link" href="#chatMain">跳到对话内容</a>

<!-- 图标精灵（内联，保证 file:// 下可用） -->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 1.8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 12h2M10 12h10M4 17h9M18 17h2"/><circle cx="15.5" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="15.5" cy="17" r="2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5a4 4 0 0 1 0 5M18.5 7a8 8 0 0 1 0 10"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l1 12a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1l1-12M10 11v6M14 11v6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M20.5 3.5 3.5 10.5l6.5 2.5 2.5 6.5 8-16z"/><path d="M10 13 20.5 3.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-7 5-13 14-13 0 9-5 13-11 13H5z"/><path d="M5 19c2-4 5-7 9-9"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 19 6v5.5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 7.5a4.2 4.2 0 0 1 7 3.2C19 15.6 12 20 12 20z"/></symbol>
    <symbol id="i-pill" viewBox="0 0 24 24"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5"/><path d="M12 8.5v7"/></symbol>
    <symbol id="i-siren" viewBox="0 0 24 24"><path d="M6 18v-5a6 6 0 0 1 12 0v5"/><rect x="4" y="18" width="16" height="3" rx="1.5"/><path d="M12 3v2M5.2 6.2l1.4 1.4M18.8 6.2l-1.4 1.4"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.6 2.5 13.4 0 16M12 4c-2.5 2.6-2.5 13.4 0 16"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  </defs>
</svg>

<div class="app">
  <!-- 顶栏 -->
  <header class="header">
    <div class="header__id">
      <div class="header__avatar">
        <img src="assets/温婉晚辈头像.webp" alt="" width="52" height="52"
             onerror="this.style.display='none';this.parentElement.textContent='🌿';">
      </div>
      <div style="min-width:0">
        <div class="header__name">小暖</div>
        <div class="header__status" id="statusText">温婉邻居型 · 温婉端庄，先安抚再建议</div>
      </div>
    </div>
    <div class="header__actions">
      <a class="icon-btn" href="index.html" aria-label="查看人格测试报告" title="测试报告">
        <svg class="icon" aria-hidden="true"><use href="#i-chart"></use></svg>
      </a>
      <button class="icon-btn" type="button" id="btnHistory" aria-label="历史对话" title="历史对话">
        <svg class="icon" aria-hidden="true"><use href="#i-history"></use></svg>
      </button>
      <button class="icon-btn" type="button" id="btnNew" aria-label="开始新对话" title="新对话">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
      </button>
      <button class="icon-btn" type="button" id="btnSettings" aria-label="对话设置" title="设置">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
      </button>
    </div>
  </header>

  <!-- 对话区 -->
  <main class="chat-main" id="chatMain">
    <section class="welcome" id="welcome">
      <div class="welcome__avatar">
        <img src="assets/温婉晚辈头像.webp" alt="" width="96" height="96"
             onerror="this.style.display='none';this.parentElement.textContent='🌿';">
      </div>
      <h1>您好，我是小暖</h1>
      <p>您的健康陪护伙伴，有什么想聊的？</p>
      <div class="welcome__tips">
        <span><svg class="icon icon--sm" aria-hidden="true"><use href="#i-heart"></use></svg>日常健康</span>
        <span><svg class="icon icon--sm" aria-hidden="true"><use href="#i-pill"></use></svg>用药提醒</span>
        <span><svg class="icon icon--sm" aria-hidden="true"><use href="#i-siren"></use></svg>急症识别</span>
        <span><svg class="icon icon--sm" aria-hidden="true"><use href="#i-chat"></use></svg>情感陪伴</span>
      </div>
    </section>

    <div class="messages" id="messages" aria-label="对话消息"></div>

    <div class="typing" id="typing" hidden>
      <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
      <span>小暖正在思考…</span>
    </div>
  </main>

  <!-- 快捷问题 -->
  <div class="quick-chips" id="quickChips" role="group" aria-label="常见问题">
    <button class="chip" type="button" data-quick="我血压有点高，是不是该加药了？">血压高</button>
    <button class="chip" type="button" data-quick="胸口闷得慌，后背也疼">胸口闷</button>
    <button class="chip" type="button" data-quick="最近老是半夜醒，睡不着">睡不着</button>
    <button class="chip" type="button" data-quick="有人敲门说是查水表的">有人敲门</button>
    <button class="chip" type="button" data-quick="今天是我老伴走了三年的日子">想聊聊</button>
  </div>

  <!-- 输入区 -->
  <form class="composer" id="composerForm" novalidate>
    <div class="composer__inner">
      <label class="sr-only" for="userInput">输入您想说的话</label>
      <button class="mic-btn" type="button" id="micBtn" aria-label="语音输入" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#i-mic"></use></svg>
      </button>
      <textarea id="userInput" rows="1" placeholder="输入文字，或点话筒说话…"
                autocomplete="off" autocapitalize="off"></textarea>
      <button class="send-btn" type="submit" id="sendBtn">
        <svg class="icon" aria-hidden="true"><use href="#i-send"></use></svg>
        <span class="label">发送</span>
      </button>
    </div>
  </form>
</div>

<!-- 屏幕阅读器状态播报 -->
<p class="sr-only" id="liveStatus" role="status" aria-live="polite"></p>

<!-- 设置弹窗 -->
<dialog class="dialog" id="settingsDialog" aria-labelledby="settingsTitle">
  <div class="dialog__head">
    <h2 id="settingsTitle">对话设置</h2>
    <button class="icon-btn icon-btn--plain" type="button" data-close aria-label="关闭设置">
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="dialog__body">
    <div class="field">
      <label for="personalitySelect">人格风格</label>
      <select class="select" id="personalitySelect">
        <option value="温婉邻居型" selected>温婉邻居型（推荐）</option>
        <option value="贴心闺女型">贴心闺女型（情感模式）</option>
        <option value="素朴家常型">素朴家常型（接地气）</option>
        <option value="从容守护型">从容守护型（结构化）</option>
      </select>
    </div>

    <div class="field">
      <label for="backendUrl">后端地址</label>
      <input class="input" type="url" id="backendUrl" value="http://127.0.0.1:8000"
             inputmode="url" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="backendApiKey">后端访问密钥（部署方提供，可留空）</label>
      <input class="input" type="password" id="backendApiKey" placeholder="X-API-Key，可留空"
             autocomplete="off" spellcheck="false">
    </div>

    <label class="switch" for="autoTts">
      <input type="checkbox" id="autoTts">
      <span class="switch__track" aria-hidden="true"></span>
      <span>自动语音播报小暖回复</span>
    </label>

    <div class="field">
      <span id="fontSizeLabel" style="font-weight:700">字体大小</span>
      <div class="segmented" role="group" aria-labelledby="fontSizeLabel" id="fontSizeSeg">
        <button type="button" data-size="normal" aria-pressed="true">标准</button>
        <button type="button" data-size="large" aria-pressed="false">大</button>
        <button type="button" data-size="xlarge" aria-pressed="false">特大</button>
      </div>
    </div>

    <label class="switch" for="hcMode">
      <input type="checkbox" id="hcMode">
      <span class="switch__track" aria-hidden="true"></span>
      <span>高对比模式（弱视）</span>
    </label>

    <p class="field-hint">
      对话由后端（backend/）处理，大模型 API Key 保存在服务器环境变量中，浏览器不接触。
      若后端设置了 BACKEND_API_KEY，请在上面填写访问密钥。语音输入需要浏览器支持语音识别。
    </p>
  </div>
  <div class="dialog__foot">
    <button class="btn btn--ghost" type="button" data-close>取消</button>
    <button class="btn btn--primary" type="button" id="saveSettings">保存</button>
  </div>
</dialog>

<!-- 历史对话弹窗 -->
<dialog class="dialog" id="historyDialog" aria-labelledby="historyTitle">
  <div class="dialog__head">
    <h2 id="historyTitle">历史对话</h2>
    <button class="icon-btn icon-btn--plain" type="button" data-close aria-label="关闭历史对话">
      <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="dialog__body" id="sessionList">
    <p class="empty">加载中…</p>
  </div>
  <div class="dialog__foot">
    <button class="btn btn--primary" type="button" data-close>关闭</button>
  </div>
</dialog>

<script src="scripts/chat.js"></script>
</body>
</html>
