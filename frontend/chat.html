<!DOCTYPE html>
<html lang="zh-CN" class="fs-normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小暖 · 健康陪护</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   设计原则：适老化、大字体、高对比、暖色调、大触控区域
   ═══════════════════════════════════════════════════════════════ */

:root {
  --bg: #FFF8F3;
  --surface: #FFFFFF;
  --warm: #F97316;
  --warm-light: #FFF1E8;
  --warm-dark: #EA580C;
  --user-bg: #E0F2FE;
  --user-text: #0C4A6E;
  --assistant-bg: #FFF1E8;
  --assistant-text: #431407;
  --text: #292524;
  --text-secondary: #78716C;
  --border: #E7E5E4;
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --font-base: 20px;
  --font-lg: 24px;
  --font-xl: 30px;
}

/* 字体大小档位 */
html.fs-normal  { --font-base: 20px; --font-lg: 24px; --font-xl: 30px; }
html.fs-large   { --font-base: 24px; --font-lg: 28px; --font-xl: 34px; }
html.fs-xlarge  { --font-base: 28px; --font-lg: 32px; --font-xl: 40px; }

/* 高对比模式（适老化：弱视老人） */
html.hc {
  --bg: #FFFFFF;
  --user-bg: #0369A1;
  --user-text: #FFFFFF;
  --assistant-bg: #FFF7ED;
  --assistant-text: #1C0A00;
  --text: #000000;
  --text-secondary: #44403C;
  --border: #57534E;
}
html.hc .bubble { box-shadow: none; border: 2px solid var(--border); }
html.hc .msg.user .bubble { border-color: #075985; }
html.hc .quick-chips button { border-color: #57534E; color: #000; }

/* 键盘可达性：清晰的焦点框 */
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible {
  outline: 4px solid #FDBA74;
  outline-offset: 2px;
}

/* 尊重系统“减少动画”偏好 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .chat-main { scroll-behavior: auto; }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: var(--font-base);
  line-height: 1.7;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  border: none;
  background: none;
  cursor: pointer;
}

/* 应用容器 */
.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 900px;
  margin: 0 auto;
  background: var(--surface);
  box-shadow: var(--shadow);
}

/* ═══════════════════════════════════════════════════════════════
   顶部导航
   ═══════════════════════════════════════════════════════════════ */
.header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 20px;
  background: linear-gradient(135deg, #F97316 0%, #FB923C 100%);
  color: #fff;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  overflow: hidden;
  border: 3px solid rgba(255,255,255,0.6);
  flex-shrink: 0;
}

.header-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.header-name {
  font-size: var(--font-lg);
  font-weight: 700;
  letter-spacing: 1px;
}

.header-status {
  font-size: 16px;
  opacity: 0.95;
}

.icon-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  background: rgba(255,255,255,0.2);
  color: #fff;
  transition: background 0.2s;
}

.icon-btn:active {
  background: rgba(255,255,255,0.35);
}

/* ═══════════════════════════════════════════════════════════════
   聊天主区域
   ═══════════════════════════════════════════════════════════════ */
.chat-main {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  scroll-behavior: smooth;
}

.chat-main::-webkit-scrollbar {
  width: 6px;
}

.chat-main::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

.welcome {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}

.welcome-avatar {
  width: 90px;
  height: 90px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: var(--warm-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

.welcome h1 {
  font-size: var(--font-xl);
  color: var(--text);
  margin-bottom: 12px;
  font-weight: 700;
}

.welcome p {
  font-size: var(--font-base);
  margin-bottom: 24px;
}

.welcome-tips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.welcome-tips span {
  background: #F5F5F4;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 18px;
  color: var(--text);
}

.messages {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.msg {
  display: flex;
  gap: 12px;
  max-width: 100%;
  animation: msgIn 0.3s ease;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.user {
  flex-direction: row-reverse;
}

.msg-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  overflow: hidden;
}

.msg.user .msg-avatar {
  background: var(--user-bg);
}

.msg.assistant .msg-avatar {
  background: var(--warm-light);
}

.msg-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.msg-body {
  max-width: 78%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.msg.user .msg-body {
  align-items: flex-end;
}

.bubble {
  padding: 18px 22px;
  border-radius: var(--radius-xl);
  font-size: var(--font-base);
  line-height: 1.75;
  word-break: break-word;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.msg.user .bubble {
  background: var(--user-bg);
  color: var(--user-text);
  border-bottom-right-radius: 8px;
}

.msg.assistant .bubble {
  background: var(--assistant-bg);
  color: var(--assistant-text);
  border-bottom-left-radius: 8px;
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  color: var(--text-secondary);
}

.msg.user .msg-meta {
  justify-content: flex-end;
}

.risk-badge {
  display: inline-flex;
  align-items: center;
  padding: 5px 12px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 15px;
}

.risk-S0 { background: #FEE2E2; color: #B91C1C; }
.risk-S1 { background: #FFEDD5; color: #C2410C; }
.risk-S2 { background: #FEF3C7; color: #B45309; }
.risk-M0 { background: #FCE7F3; color: #BE185D; }
.risk-M1 { background: #FAE8FF; color: #9333EA; }
.risk-R3 { background: #DC2626; color: #fff; }
.risk-R2b { background: #FEE2E2; color: #B91C1C; }
.risk-R2a { background: #FFEDD5; color: #C2410C; }
.risk-R1 { background: #FEF3C7; color: #B45309; }
.risk-R0 { background: #DCFCE7; color: #15803D; }
.risk-X { background: #F5F5F4; color: #78716C; }

.tts-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  background: #fff;
  border: 1px solid var(--border);
  color: var(--warm-dark);
}

.tts-btn:active {
  background: var(--warm-light);
}

/* ═══════════════════════════════════════════════════════════════
   快捷问题条
   ═══════════════════════════════════════════════════════════════ */
.quick-chips {
  flex-shrink: 0;
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 14px 20px;
  background: #FAFAF9;
  border-top: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.quick-chips::-webkit-scrollbar {
  display: none;
}

.quick-chips button {
  flex-shrink: 0;
  padding: 12px 22px;
  border-radius: 999px;
  background: #fff;
  border: 2px solid var(--border);
  color: var(--text);
  font-size: 18px;
  font-weight: 500;
  transition: all 0.15s;
}

.quick-chips button:active {
  border-color: var(--warm);
  color: var(--warm-dark);
  background: var(--warm-light);
}

/* ═══════════════════════════════════════════════════════════════
   输入区域
   ═══════════════════════════════════════════════════════════════ */
.input-area {
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  padding: 16px 18px 22px;
  background: #fff;
  border-top: 1px solid var(--border);
}

.input-area textarea {
  flex: 1;
  min-height: 58px;
  max-height: 160px;
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  resize: none;
  outline: none;
  line-height: 1.6;
  background: #FAFAF9;
  font-size: var(--font-base);
}

.input-area textarea:focus {
  border-color: var(--warm);
  background: #fff;
}

.mic-btn, .send-btn {
  height: 58px;
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.mic-btn {
  width: 58px;
  background: #F5F5F4;
  border: 2px solid var(--border);
  font-size: 26px;
}

.mic-btn.listening {
  background: #FEE2E2;
  border-color: #EF4444;
  color: #B91C1C;
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.send-btn {
  padding: 0 28px;
  background: var(--warm);
  color: #fff;
  font-size: var(--font-base);
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(249,115,22,0.3);
}

.send-btn:active {
  background: var(--warm-dark);
}

.send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* 正在输入提示 */
.typing {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  color: var(--text-secondary);
  font-size: 17px;
}

.typing span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--warm);
  animation: typingDot 1.4s infinite ease-in-out;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingDot {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* 系统提示消息 */
.system-msg {
  text-align: center;
  font-size: 17px;
  color: var(--text-secondary);
  padding: 10px 0;
}

/* 质检警告条 */
.quality-warning {
  margin-top: 8px;
  padding: 12px 16px;
  background: #FEE2E2;
  color: #991B1B;
  border-radius: var(--radius-md);
  font-size: 17px;
  line-height: 1.6;
}

/* ═══════════════════════════════════════════════════════════════
   设置弹窗
   ═══════════════════════════════════════════════════════════════ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(3px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow-y: auto;
  background: #fff;
  border-radius: var(--radius-xl);
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 24px;
  border-bottom: 1px solid var(--border);
}

.modal-header h2 {
  font-size: var(--font-lg);
  font-weight: 700;
}

.modal-header button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 24px;
  color: var(--text-secondary);
  background: #F5F5F4;
}

.modal-body {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.modal-body label {
  font-size: var(--font-base);
  font-weight: 700;
  color: var(--text);
  margin-bottom: -10px;
}

.modal-body input,
.modal-body select {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  outline: none;
  background: #FAFAF9;
}

.modal-body input:focus,
.modal-body select:focus {
  border-color: var(--warm);
  background: #fff;
}

.toggle-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 0;
}

.toggle-row input[type="checkbox"] {
  width: 26px;
  height: 26px;
  accent-color: var(--warm);
  flex-shrink: 0;
}

.font-size-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.font-size-row .seg {
  display: flex;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.font-size-row .seg button {
  padding: 10px 18px;
  font-size: var(--font-base);
  border-right: 1px solid var(--border);
  background: #FAFAF9;
}

.font-size-row .seg button:last-child {
  border-right: none;
}

.font-size-row .seg button.active {
  background: var(--warm);
  color: #fff;
  font-weight: 700;
}

.settings-note {
  font-size: 16px;
  color: var(--text-secondary);
  line-height: 1.6;
  padding: 8px 0;
}

.modal-footer {
  display: flex;
  gap: 12px;
  padding: 18px 24px 24px;
  border-top: 1px solid var(--border);
}

.modal-footer button {
  flex: 1;
  padding: 16px;
  border-radius: var(--radius-md);
  font-size: var(--font-base);
  font-weight: 700;
  border: 2px solid var(--border);
  background: #fff;
}

.modal-footer button.primary {
  background: var(--warm);
  color: #fff;
  border-color: var(--warm);
}

/* 小屏适配 */
@media (max-width: 480px) {
  .header {
    padding: 14px 16px;
  }
  .chat-main {
    padding: 14px;
  }
  .bubble {
    padding: 16px 18px;
  }
  .msg-body {
    max-width: 84%;
  }
  .input-area {
    padding: 12px 14px 18px;
  }
}
</style>
</head>
<body>

<div class="app">
  <!-- 顶部 -->
  <header class="header">
    <div class="header-left">
      <div class="header-avatar">
        <img src="温婉晚辈头像.png" alt="小暖" onerror="this.style.display='none'; this.parentElement.textContent='🌿';">
      </div>
      <div>
        <div class="header-name">小暖</div>
        <div class="header-status" id="statusText">健康陪护助手 · 温婉邻居型</div>
      </div>
    </div>
    <button class="icon-btn" onclick="toggleSettings()" aria-label="设置">⚙️</button>
  </header>

  <!-- 聊天区 -->
  <main class="chat-main" id="chatMain">
    <div class="welcome" id="welcome">
      <div class="welcome-avatar">🌿</div>
      <h1>您好，我是小暖</h1>
      <p>您的健康陪护伙伴，有什么想聊的？</p>
      <div class="welcome-tips">
        <span>💬 日常健康</span>
        <span>💊 用药提醒</span>
        <span>🚨 急症识别</span>
        <span>❤️ 情感陪伴</span>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing" id="typing" style="display:none;">
      <span></span><span></span><span></span>
      <span style="margin-left:6px;">小暖正在思考…</span>
    </div>
  </main>

  <!-- 快捷问题 -->
  <div class="quick-chips" id="quickChips">
    <button onclick="quickAsk('我血压有点高，是不是该加药了？')">血压高</button>
    <button onclick="quickAsk('胸口闷得慌，后背也疼')">胸口闷</button>
    <button onclick="quickAsk('最近老是半夜醒，睡不着')">睡不着</button>
    <button onclick="quickAsk('有人敲门说是查水表的')">有人敲门</button>
    <button onclick="quickAsk('今天是我老伴走了三年的日子')">想聊聊</button>
  </div>

  <!-- 输入区 -->
  <div class="input-area">
    <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()" aria-label="语音输入">🎤</button>
    <textarea id="userInput" rows="1" placeholder="输入文字，或点话筒说话…" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>对话设置</h2>
      <button onclick="toggleSettings()" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body">
      <label>人格风格</label>
      <select id="personalitySelect">
        <option value="温婉邻居型" selected>温婉邻居型（推荐）</option>
        <option value="贴心闺女型">贴心闺女型（情感模式）</option>
        <option value="素朴家常型">素朴家常型（接地气）</option>
        <option value="从容守护型">从容守护型（结构化）</option>
      </select>

      <label>API 地址</label>
      <input type="text" id="apiBaseUrl" value="https://api.deepseek.com/v1">

      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="输入 API Key（仅保存在本浏览器）">

      <label>模型</label>
      <input type="text" id="modelName" value="deepseek-chat">

      <div class="toggle-row">
        <input type="checkbox" id="autoTts">
        <span>自动语音播报小暖回复</span>
      </div>

      <div class="font-size-row">
        <span>字体大小</span>
        <div class="seg" id="fontSizeSeg">
          <button data-size="normal" onclick="setFontSize('normal')">A</button>
          <button data-size="large" onclick="setFontSize('large')">大</button>
          <button data-size="xlarge" onclick="setFontSize('xlarge')">特大</button>
        </div>
      </div>

      <p class="settings-note">
        API Key 仅保存在本浏览器 localStorage 中，不会上传到服务器。语音输入需要浏览器支持语音识别。
      </p>
    </div>
    <div class="modal-footer">
      <button onclick="toggleSettings()">取消</button>
      <button class="primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// System Prompt（精简版，保留核心安全边界与分级策略）
// ═══════════════════════════════════════════════════════════════
const SKILL_BASE = `你是一位温和、耐心、尊重、可靠的老年陪护伙伴，名叫小暖。
你像住在隔壁的懂事晚辈——有温度但不煽情，有分寸但不疏离。

【说话风格】温婉、端庄、有分寸。先安抚→再解释→再建议→再兜底。
常用词：您 | 咱们 | 慢慢地 | 别着急 | 我帮您记着。
称呼：默认统一用"您"。只有用户明确是老人本人且能判性别时才用"阿姨""叔叔"。
家属场景（"我妈""我爸"）称呼用户"您"，称呼老人"老人家"。
绝对不用"奶奶""爷爷""老太太""老头"。

【场景分类与优先级】S类 > M0 > R3 > R2b > R2a > M1 > R1 > R0 > X

S0 人身安全紧急：敲门求救/尾随/入室/暴力威胁/诈骗进行中 → 不建议开门/外出，立即110，锁门窗，大声告知已报警，安抚等待。
S1 环境安全紧急：起火/煤气/浓烟/漏水漏电 → 119/燃气公司，能撤离走楼梯不乘电梯，不能撤离关门窗堵缝等待。
S2 诈骗/财产风险：中奖/冒充公检法/保健品会销/可疑链接 → 不转账不扫码不透露信息，联系子女，必要时110。

M0 心理危机："不想活了""活着没意思""想死" → 直接关切不回避，倾听不评判，建议拨打心理援助热线 400-161-9995，建议家人陪同就医。禁止"想开点""多出去走走"。
M1 严重情绪困扰：持续悲伤/焦虑失眠/孤独感 → 共情+去病耻感，建议社区心理科，不贴"抑郁症"标签。

R3 急症高危：胸痛+后背痛、卒中信号、严重低血糖、意识不清、大出血 → 直接120 + 清晰指令 + 陪伴安抚 + 记录准备。禁止"先吃药观察""躺一会儿看看"。
R2b 紧急就医：咳血/便血/黑便、摔倒不能站、发热3天不退、视力突然下降 → 今天/明天必须去，不自行处理，具体科室指引。
R2a 一般就医：异常感知、想换药/停药、慢性病失控、持续两周以上失眠 → 建议安排就诊，记录症状带去看医生。
R1 指标波动/中度不适：血压血糖波动、用药时间记混、睡眠差、便秘、头晕 → 安抚→通俗解释→非药物建议→记录提醒→联系医生/药师兜底。
R0 日常健康/情感陪伴：养生饮食、天气活动、怀念亲人、孤独感 → 共情→通俗解释→轻松建议→就医兜底。

X 非陪护话题：手机/股票/菜谱/新闻 → 友好回应但说明能力边界，不强行关联健康；涉及诈骗升级到S2。

【绝对禁止】不诊断、不开药、不给剂量、不调药、不替代医生判断、不劝退就医、不轻视症状、不贴疾病标签、S类不怂恿开门/外出、M0不说"想开点"。

【回复末尾】必须添加场景/风险标记：
[SITUATION:S0/S1/S2]、[MENTAL:M0/M1]、[RISK:R3/R2b/R2a/R1/R0]、[OTHER:X]
不要输出其他前缀、解释或元数据。`;

const PERSONALITY_OVERLAYS = {
  "温婉邻居型": "",
  "贴心闺女型": `\n\n【人格覆盖-贴心闺女型】切换为亲切软糯风格。短句为主口语化。称呼：咱/您呀/您老人家。多用反问句"您说是不是嘛"。`,
  "素朴家常型": `\n\n【人格覆盖-素朴家常型】切换为朴素接地气风格。用生活类比解释。称呼：老哥/老姐。不用叠词不撒娇。短句口语化，北方话味道。`,
  "从容守护型": `\n\n【人格覆盖-从容守护型】切换为淡定从容风格。结构化：第一/第二/第三。称呼：您，不加修饰。不用叠词语气词。`
};

const PERSONALITY_DESCS = {
  "温婉邻居型": "温婉端庄，先安抚再建议",
  "贴心闺女型": "亲切软糯，情感模式",
  "素朴家常型": "朴素接地气，大白话",
  "从容守护型": "淡定从容，一二三讲清楚"
};

// ═══════════════════════════════════════════════════════════════
// 状态
// ═══════════════════════════════════════════════════════════════
let currentPersonality = "温婉邻居型";
let autoTtsEnabled = false;
let currentFontSize = "normal";
let isGenerating = false;
let isListening = false;
let messages = [
  { role: "system", content: SKILL_BASE + PERSONALITY_OVERLAYS[currentPersonality] }
];

const synth = window.speechSynthesis;
let zhVoice = null;
let recognition = null;

// ═══════════════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════════════
(function init() {
  loadVoices();
  if (synth && synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = loadVoices;
  }
  initSpeechRecognition();

  const saved = JSON.parse(localStorage.getItem('xiaonuan_settings') || '{}');
  if (saved.apiKey) document.getElementById('apiKey').value = saved.apiKey;
  if (saved.apiBaseUrl) document.getElementById('apiBaseUrl').value = saved.apiBaseUrl;
  if (saved.modelName) document.getElementById('modelName').value = saved.modelName;
  if (saved.personality) {
    document.getElementById('personalitySelect').value = saved.personality;
    currentPersonality = saved.personality;
    messages[0] = { role: "system", content: SKILL_BASE + PERSONALITY_OVERLAYS[currentPersonality] };
  }
  if (saved.autoTts) {
    autoTtsEnabled = saved.autoTts;
    document.getElementById('autoTts').checked = saved.autoTts;
  }
  if (saved.fontSize) {
    setFontSize(saved.fontSize, false);
  }
  updateStatus();
})();

function updateStatus() {
  const key = document.getElementById('apiKey').value.trim();
  const status = document.getElementById('statusText');
  const desc = PERSONALITY_DESCS[currentPersonality] || '';
  if (!key) {
    status.textContent = `${currentPersonality} · ${desc} · 请先配置 API Key`;
  } else {
    status.textContent = `${currentPersonality} · ${desc}`;
  }
}

// ═══════════════════════════════════════════════════════════════
// TTS
// ═══════════════════════════════════════════════════════════════
function loadVoices() {
  if (!synth) return;
  const voices = synth.getVoices();
  zhVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh')) ||
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith('cmn')) ||
            null;
}

function speak(text) {
  if (!window.SpeechSynthesisUtterance || !synth) {
    showSystemMsg('当前浏览器不支持语音播报');
    return;
  }
  if (synth.speaking) synth.cancel();
  const clean = text.replace(/\s*\[(?:SITUATION|S|MENTAL|RISK|OTHER):[^\]]+\]\s*$/g, '').trim();
  if (!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.voice = zhVoice;
  u.lang = 'zh-CN';
  u.rate = 0.9;
  u.pitch = 1;
  synth.speak(u);
}

// ═══════════════════════════════════════════════════════════════
// 语音输入（STT）
// ═══════════════════════════════════════════════════════════════
function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = (event) => {
    let final = '';
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += transcript;
      else interim += transcript;
    }
    const input = document.getElementById('userInput');
    input.value = (input.dataset.finalText || '') + final + interim;
    autoResize(input);
    if (final) input.dataset.finalText = (input.dataset.finalText || '') + final;
  };

  recognition.onerror = (event) => {
    console.warn('语音识别错误', event.error);
    showSystemMsg('语音识别出错，请检查麦克风权限');
    stopListening();
  };

  recognition.onend = () => {
    if (isListening) {
      // 用户未主动停止，可能是短暂停顿，继续监听
      try { recognition.start(); } catch (e) {}
    } else {
      stopListening();
    }
  };
}

function toggleVoiceInput() {
  if (!recognition) {
    showSystemMsg('您的浏览器不支持语音识别');
    return;
  }
  if (isListening) {
    isListening = false;
    try { recognition.stop(); } catch (e) {}
    stopListening();
  } else {
    const input = document.getElementById('userInput');
    input.value = '';
    input.dataset.finalText = '';
    autoResize(input);
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
    try { recognition.start(); } catch (e) {}
    showSystemMsg('正在听，请说话…');
  }
}

function stopListening() {
  isListening = false;
  document.getElementById('micBtn').classList.remove('listening');
}

// ═══════════════════════════════════════════════════════════════
// UI 交互
// ═══════════════════════════════════════════════════════════════
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function setFontSize(size, save = true) {
  currentFontSize = size;
  document.documentElement.className = 'fs-' + size;
  document.querySelectorAll('#fontSizeSeg button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.size === size);
  });
  if (save) {
    localStorage.setItem('xiaonuan_settings', JSON.stringify({
      ...JSON.parse(localStorage.getItem('xiaonuan_settings') || '{}'),
      fontSize: size
    }));
  }
}

function toggleSettings() {
  document.getElementById('settingsModal').classList.toggle('show');
}

function saveSettings() {
  const personality = document.getElementById('personalitySelect').value;
  const apiKey = document.getElementById('apiKey').value.trim();
  const apiBaseUrl = document.getElementById('apiBaseUrl').value.trim();
  const modelName = document.getElementById('modelName').value.trim();
  const autoTts = document.getElementById('autoTts').checked;

  localStorage.setItem('xiaonuan_settings', JSON.stringify({
    apiKey, apiBaseUrl, modelName, personality, autoTts, fontSize: currentFontSize
  }));

  if (personality !== currentPersonality) {
    currentPersonality = personality;
    messages[0] = { role: "system", content: SKILL_BASE + PERSONALITY_OVERLAYS[personality] };
    showSystemMsg(`已切换为「${personality}」`);
  }
  autoTtsEnabled = autoTts;
  updateStatus();
  toggleSettings();
}

function quickAsk(text) {
  const input = document.getElementById('userInput');
  input.value = text;
  autoResize(input);
  sendMessage();
}

function showSystemMsg(text) {
  const el = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent = text;
  el.appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  const main = document.getElementById('chatMain');
  main.scrollTop = main.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ═══════════════════════════════════════════════════════════════
// 消息渲染
// ═══════════════════════════════════════════════════════════════
const RISK_CLASS_MAP = {
  "S0":"S0","S1":"S1","S2":"S2",
  "M0":"M0","M1":"M1",
  "R3":"R3","R2b":"R2b","R2a":"R2a","R1":"R1","R0":"R0",
  "X":"X"
};
const RISK_LABEL_MAP = {
  "S0":"人身安全","S1":"环境安全","S2":"防诈骗",
  "M0":"心理危机","M1":"情绪困扰",
  "R3":"急症120","R2b":"紧急就医","R2a":"尽快就医","R1":"一般关注","R0":"日常",
  "X":"非健康"
};

function addMessage(role, content, risk) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  const container = document.getElementById('messages');
  const msgDiv = document.createElement('div');
  msgDiv.className = `msg ${role}`;

  const avatar = role === 'user'
    ? '<div class="msg-avatar" title="我">🧓</div>'
    : '<div class="msg-avatar" title="小暖"><img src="温婉晚辈头像.png" alt="小暖" onerror="this.style.display=\'none\'; this.parentElement.textContent=\'🌿\';"></div>';

  const cssClass = RISK_CLASS_MAP[risk] || "R0";
  const label = RISK_LABEL_MAP[risk] || risk || '';

  msgDiv.innerHTML = `
    ${avatar}
    <div class="msg-body">
      <div class="bubble">${escapeHtml(content)}</div>
      <div class="msg-meta">
        ${label ? `<span class="risk-badge risk-${cssClass}">${label}</span>` : ''}
        ${role === 'assistant' ? '<button class="tts-btn" title="朗读">🔊</button>' : ''}
      </div>
    </div>
  `;

  container.appendChild(msgDiv);

  if (role === 'assistant') {
    msgDiv.querySelector('.tts-btn').addEventListener('click', () => speak(content));
    if (autoTtsEnabled) speak(content);
  }

  scrollToBottom();
  return msgDiv;
}

function setTyping(show) {
  document.getElementById('typing').style.display = show ? 'flex' : 'none';
  document.getElementById('sendBtn').disabled = show;
}

// ═══════════════════════════════════════════════════════════════
// 安全快检（关键词 + 否定句式过滤）
// ═══════════════════════════════════════════════════════════════
function quickCheck(reply, llmRisk) {
  const cleaned = reply.replace(
    /(?:不要|不能|不可|别|切勿|禁止|避免|不是|不会|不一定).{0,30}?(?:自己加|自己减|自己停|换药|调药|幻觉|老年痴呆|抑郁症|诊断|开药|躺一会儿看看|观察观察|喝点热水|睡一觉|不用去医院|没必要看医生|先吃药看看|捂一捂|烫烫脚|自己吃|乱吃|停掉试试|停几天看看)/g,
    '[安全警告已过滤]'
  );

  const forbidden = {
    "我给你开药":"开药","我给您开药":"开药",
    "药量你自己调":"引导调药",
    "你自己加":"引导加药","你自己减":"引导减药","你自己停":"引导停药",
    "停掉试试":"引导停药","停几天看看":"引导停药","先不吃看看":"引导停药",
    "不用去医院":"劝退就医","没必要看医生":"劝退就医",
    "喝点热水就好":"轻视症状","多喝热水":"轻视症状","喝杯热水":"轻视症状",
    "睡一觉就好了":"延误就医",
    "躺一会儿看看":"延误急症","你先观察观察":"延误急症",
    "先吃药看看":"急症延误-建议吃药观察","先吃片药观察":"急症延误-建议吃药观察","先吃片阿司匹林看看":"急症延误-建议吃药观察",
    "你这是高血压":"诊断","你的症状是典型的高血压":"诊断","你这是糖尿病":"诊断","你这是抑郁症":"诊断",
    "你这是老年痴呆":"标签","你这是普通感冒":"诊断",
    "你就是幻觉":"否定感知","你就是太累了":"否定感知",
    "老糊涂":"不尊重用语","脑子退化":"不尊重用语",
    "想开点就好了":"心理危机-轻描淡写","多出去走走就好了":"心理危机-轻描淡写",
    "开门看看":"人身安全-怂恿开门","出去帮一下":"人身安全-怂恿外出",
    "开开门吧":"人身安全-怂恿开门","帮帮她":"人身安全-危及自身",
    "吃硝苯地平":"开药","吃一片阿司匹林":"开药",
    "烫烫脚":"烫伤风险/轻视症状","捂一捂":"轻视症状"
  };

  const issues = [];
  for (const [phrase, reason] of Object.entries(forbidden)) {
    if (cleaned.includes(phrase)) issues.push(`[红线] ${reason}: "${phrase}"`);
  }

  if (llmRisk === 'R3' || llmRisk === 'S0') {
    if (!reply.includes('110') && !reply.includes('120') && !reply.includes('急救') && !reply.includes('急诊') && !reply.includes('报警')) {
      issues.push(`[红线] ${llmRisk}级别但缺失110/120/急救/急诊/报警`);
    }
  }
  if (llmRisk === 'S1') {
    if (!reply.includes('119') && !reply.includes('火警') && !reply.includes('燃气') && !reply.includes('报警')) {
      issues.push('[红线] S1级别但缺失119/火警/燃气公司/报警');
    }
  }
  if (llmRisk === 'M0') {
    if (!reply.includes('热线') && !reply.includes('就医') && !reply.includes('医院') && !reply.includes('医生') && !reply.includes('心理')) {
      issues.push('[红线] M0级别未建议心理援助热线或就医');
    }
  }

  return issues;
}

// ═══════════════════════════════════════════════════════════════
// 发送消息
// ═══════════════════════════════════════════════════════════════
async function sendMessage() {
  if (isGenerating) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    showSystemMsg('请先点击右上角「设置」配置 API Key');
    toggleSettings();
    return;
  }

  // 停止语音输入
  if (isListening) toggleVoiceInput();

  addMessage('user', text, null);
  messages.push({ role: "user", content: text });

  input.value = '';
  input.dataset.finalText = '';
  autoResize(input);
  setTyping(true);
  isGenerating = true;

  const baseUrl = document.getElementById('apiBaseUrl').value.trim();
  const model = document.getElementById('modelName').value.trim();

  try {
    const resp = await fetch(`${baseUrl}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model,
        messages: messages.slice(-10),
        temperature: 0.7,
        max_tokens: 600
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    let rawReply = data.choices[0].message.content.trim();

    // 提取场景/风险标签（末尾优先，任意位置兜底）
    const tagPatternEnd = /\[(?:SITUATION:(S[0-2])|MENTAL:(M[0-1])|RISK:(R[0-3][ab]?)|OTHER:(X))\]\s*$/;
    const tagPatternAny = /\[(?:SITUATION:(S[0-2])|MENTAL:(M[0-1])|RISK:(R[0-3][ab]?)|OTHER:(X))\]/;
    let m = rawReply.match(tagPatternEnd) || rawReply.match(tagPatternAny);
    let llmRisk = "?";
    let reply = rawReply;
    if (m) {
      llmRisk = m[1] || m[2] || m[3] || m[4];
      reply = (rawReply.substring(0, m.index) + rawReply.substring(m.index + m[0].length)).trim();
    }

    const issues = quickCheck(reply, llmRisk);
    const msgDiv = addMessage('assistant', reply, llmRisk);

    if (issues.length > 0) {
      const warn = document.createElement('div');
      warn.className = 'quality-warning';
      warn.textContent = '⚠️ 质检提示：' + issues.join(' | ');
      msgDiv.querySelector('.msg-body').appendChild(warn);
    }

    messages.push({ role: "assistant", content: rawReply });

  } catch (e) {
    showSystemMsg('请求出错：' + e.message);
  } finally {
    setTyping(false);
    isGenerating = false;
  }
}
</script>
